<!doctype html>
<html lang="{{LANG_HTML}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="canonical" href="{{CANONICAL}}" />

{{ROBOTS_META}}

<!-- hreflang alternates -->
{{HREFLANG_BLOCK}}

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta property="og:image:width" content="1600" />
<meta property="og:locale" content="{{OG_LOCALE}}" />
<meta property="og:site_name" content="Lidi Studio" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE}}" />

<!-- Theme + favicon -->
<meta name="theme-color" content="#F5EBDD" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- Performance hints -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Italiana&family=JetBrains+Mono:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
{{EXTRA_HEAD}}

<!-- Styles -->
<link rel="stylesheet" href="/styles.css">

<!-- Schema.org JSON-LD -->
{{SCHEMA_JSON_LD}}
</head>
<body>
