<script>
  // Hero entrance (only fires if hero element exists on this page)
  requestAnimationFrame(()=>document.getElementById('hero')?.classList.add('is-in'));

  // Reveal observer
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal, .commission').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.reveal, .commission').forEach(el => el.classList.add('is-in'));
  }

  // Burger menu
  const burger = document.getElementById('burger');
  const links = document.getElementById('navlinks');
  if(burger){ burger.addEventListener('click', () => links.classList.toggle('is-open')); }
  document.querySelectorAll('#navlinks a').forEach(a => a.addEventListener('click', () => links?.classList.remove('is-open')));
</script>
</body>
</html>
