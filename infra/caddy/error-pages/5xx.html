<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5EBDD" />
<meta name="robots" content="noindex" />
<title>Briefly unreachable · Lidi Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400&display=swap" />

<style>
  :root {
    --cream:    #F5EBDD;
    --mauve:    #D4B5B0;
    --pearl:    #C9C2B8;
    --gold:     #B89968;
    --charcoal: #4A3F38;
    --charcoal-soft: rgba(74, 63, 56, 0.6);
    --charcoal-faint: rgba(74, 63, 56, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    padding: clamp(20px, 5vw, 60px);
  }

  .frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(28px, 5vh, 56px);
    max-width: 640px;
    margin: 0 auto;
    padding-top: clamp(40px, 8vh, 80px);
  }

  .monogram {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(96px, 18vw, 144px);
    line-height: 0.85;
    color: var(--gold);
    letter-spacing: -0.02em;
    user-select: none;
  }

  .eyebrow {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 28px);
    color: var(--charcoal-soft);
    letter-spacing: 0;
    line-height: 1.2;
  }

  .headline {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(32px, 5.4vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.012em;
    color: var(--charcoal);
    max-width: 18ch;
    margin: 0 auto;
  }

  .lede {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(16px, 1.4vw, 19px);
    line-height: 1.55;
    color: var(--charcoal-soft);
    max-width: 44ch;
    margin: 0 auto;
  }
  .lede a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 1px;
    transition: color 360ms cubic-bezier(0.16, 1, 0.3, 1),
                border-color 360ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .lede a:hover {
    color: var(--charcoal);
    border-color: var(--charcoal);
  }

  .footer {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--charcoal-faint);
    text-align: center;
    padding-top: clamp(40px, 6vh, 60px);
  }
</style>
</head>
<body>
  <main class="frame" role="main">
    <div class="monogram" aria-hidden="true">L</div>
    <span class="eyebrow">Five hundred</span>
    <h1 class="headline">The studio is briefly unreachable.</h1>
    <p class="lede">
      We will return shortly. The work is in progress. If this persists,
      write to <a href="mailto:lidi@lidi.studio">lidi@lidi.studio</a>.
    </p>
  </main>
  <footer class="footer">Lidi · Studio · MMXXVI</footer>
</body>
</html>
