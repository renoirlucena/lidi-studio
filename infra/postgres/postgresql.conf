# Lidi Studio — PostgreSQL 16 configuration
# Tuned for shared 4 GB host (postgres budget: 350 MB per RAM table in
# /docs/platform-architecture-v1.md §2.17). Conservative values —
# postgres co-exists with 9 other containers on the same machine.

# ──────────────── Memory ────────────────
shared_buffers = 96MB                  # ~25% of postgres mem_limit
effective_cache_size = 256MB           # planner hint about OS cache (no allocation)
maintenance_work_mem = 32MB            # one-time ops (VACUUM, CREATE INDEX)
work_mem = 4MB                         # per-sort/hash operation
wal_buffers = 4MB

# ──────────────── Connections ────────────────
max_connections = 50                   # ample for 5 services + sessions
superuser_reserved_connections = 3

# ──────────────── Write-Ahead Log ────────────────
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 256MB

# ──────────────── Query Planner ────────────────
random_page_cost = 1.1                 # NVMe SSD assumption
effective_io_concurrency = 200
default_statistics_target = 100

# ──────────────── Logging ────────────────
log_min_duration_statement = 250ms     # log queries slower than 250ms
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'America/Anchorage'
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# ──────────────── Locale / time ────────────────
timezone = 'America/Anchorage'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# ──────────────── Networking ────────────────
listen_addresses = '*'                 # only reachable on Docker network
port = 5432
